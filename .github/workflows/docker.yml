name: Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - CLAUDE.md
      - AGENTS.md
      - "tests/**"
      - "*.png"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=straker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=straker-${{ matrix.arch }}
          provenance: false

  manifest:
    name: Publish manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        shell: bash
        run: |
          image="${{ needs.build.outputs.image }}"
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:main" \
            --tag "${image}:${GITHUB_SHA}" \
            "${image}:${GITHUB_SHA}-amd64" \
            "${image}:${GITHUB_SHA}-arm64"
